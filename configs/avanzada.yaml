# Perfil "Avanzada" del resumen de modelos entregado en clase (18 nov): Qwen3-4B,
# FLUX.1-schnell, XTTS-v2 y Stable Audio Open. Todos con licencia aceptada por Diego en
# Hugging Face (FLUX y Stable Audio son gated; XTTS-v2 usa la CPML, solo uso no comercial).
#
# En la RTX 3050 de 4 GB nada de esto cabe entero en la GPU:
#   * FLUX.1-schnell (12B): transformer y T5 en fp8 en la RAM (copia local que crea
#     scripts/convertir_flux_fp8.py desde los pesos oficiales en bf16) y bloque a bloque a la
#     GPU. Sin IP-Adapter (no hay uno oficial para FLUX) ni negative prompt (schnell no usa
#     CFG): la consistencia viene del descriptor, que FLUX sigue mucho mejor que SD.
#   * XTTS-v2: en su propio entorno (.venv-xtts) y en la GPU solo mientras narra.
#   * Ambiente con AudioLDM (23 nov, decisión de Diego): Stable Audio Open 1.0 tardaba
#     ~38 s por escena (para 8 s de fondo bajo la voz) y la historia llegaba a ~15 min;
#     AudioLDM tarda ~2 s. Sigue descargado y se puede volver a poner primero en la cadena.
# Tiempos medidos el 20 nov (con Stable Audio): escena 1 a los ~3,2 min, historia en ~15 min.
extends: rapido

image:
  model_id: black-forest-labs/FLUX.1-schnell   # Apache-2.0 (gated: aceptar en HF)
  arquitectura: flux
  fp8_dir: flux-schnell-fp8                    # models/flux-schnell-fp8 (convertido en local)
  offload_grupos: true
  offload_stream: true                         # 19 nov: sin stream, cada paso copiaba los 12 GB de vuelta a la RAM
  t5_por_demanda: true                         # 19 nov: T5 solo mientras lee el prompt (~5 GB menos de RAM)
  scheduler: dpmpp                             # no se usa: FLUX trae su propio scheduler
  steps: 4                                     # schnell: 1-4 pasos
  guidance_scale: 0.0                          # schnell está destilado sin CFG
  max_sequence_length: 256
  width: 1056                                  # 3:2, ~0,74 MP (múltiplos de 16)
  height: 704
  candidatos: 1                                # FLUX sigue el prompt; 2 versiones duplican el tiempo
  negative_prompt_base: ""
  vae_slicing: true
  ip_adapter:
    enabled: false

voice:
  backend: xtts
  xtts_speaker: Ana Florence

sound:
  backends: [audioldm, library, procedural]    # 23 nov: sin Stable Audio Open (~38 s por escena)
  sao_steps: 20                                # solo si se vuelve a poner "sao" en la cadena
